name: Build Wanchat Yemen APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - setup/expo-android-variants
      - feature/wanchat-production-hardening
      - fix/android-startup-install-validation

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }} standalone APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            app_name: Wanchat Yemen
            artifact_name: wanchat-yemen-apk
          - variant: lite
            app_name: Wanchat Lite
            artifact_name: wanchat-lite-apk

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo configuration check
        run: npx expo-doctor

      - name: Generate native Android project
        env:
          APP_VARIANT: ${{ matrix.variant }}
        run: npx expo prebuild --platform android --clean --non-interactive

      # Release builds embed the JavaScript bundle in the APK.
      # Debug builds are Metro-dependent and must not be distributed.
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and embedded JavaScript bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.+\\.bundle'

      - name: Install and launch on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            APP_ID="com.wanchatyemen.messenger"
            if [ "${{ matrix.variant }}" = "lite" ]; then
              APP_ID="com.wanchatyemen.messenger.lite"
            fi

            test -f "$APK"
            adb install -r "$APK"
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 20

            # Capture diagnostics even when the app process remains alive but its UI failed.
            adb logcat -d -v time -t 3000 > startup-logcat.txt
            adb exec-out screencap -p > startup-screen.png || true

            if ! adb shell pidof "$APP_ID" >/dev/null; then
              echo "FAIL: app process exited after launch"
              cat startup-logcat.txt
              exit 1
            fi

            adb shell uiautomator dump /sdcard/wanchat-window.xml
            adb pull /sdcard/wanchat-window.xml startup-window.xml

            if ! grep -Eiq "إعداد التطبيق لأول مرة|خصوصيتك وأذونات الجهاز|Wanchat Yemen|جارٍ تجهيز إعدادات التطبيق" startup-window.xml; then
              echo "FAIL: expected Wanchat first screen was not found in Android UI hierarchy"
              cat startup-window.xml
              cat startup-logcat.txt
              exit 1
            fi

      - name: Upload startup crash log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logcat-${{ matrix.variant }}
          path: |
            startup-logcat.txt
            startup-screen.png
            startup-window.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
