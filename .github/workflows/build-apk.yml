name: Build Wanchat Yemen APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - setup/expo-android-variants

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            app_name: Wanchat Yemen
            artifact_name: wanchat-yemen-apk
          - variant: lite
            app_name: Wanchat Lite
            artifact_name: wanchat-lite-apk

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools;platforms;android-36;build-tools;36.0.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo configuration check
        run: npx expo-doctor

      - name: Generate native Android project
        env:
          APP_VARIANT: ${{ matrix.variant }}
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
